spring:
  application:
    name: api
  datasource:
    url: jdbc:h2:mem:hackathon;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

server:
  port: 8080

app:
  jwt:
    # DEV ONLY default. Override with JWT_SECRET in any shared/deployed environment (>= 32 bytes).
    secret: ${JWT_SECRET:dev-only-change-me-hackathon-jwt-secret-0123456789}
    expires-in-seconds: ${JWT_EXPIRES_IN_SECONDS:86400}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hackathon}
    username: ${DB_USER:hackathon}
    password: ${DB_PASSWORD:hackathon}
  jpa:
    hibernate:
      ddl-auto: update
